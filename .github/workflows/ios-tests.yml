name: iOS tests
on:
  push:
    branches: ['asteri/**']
  pull_request:
  workflow_dispatch:
    inputs:
      simulator:
        description: Also compile and launch the app on a macOS simulator
        type: boolean
        default: false
      native_text:
        description: Compile and test the production native feature utilities
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts/asteri/tests -v
      - run: python3 -m compileall -q scripts/asteri
  simulator:
    if: github.event_name == 'workflow_dispatch' && inputs.simulator
    needs: infrastructure
    uses: ./.github/workflows/ios-build.yml
    with:
      mode: simulator
    secrets: inherit
  native-text:
    if: github.event_name == 'workflow_dispatch' && inputs.native_text
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: submodules/AsteriFeatures
      - name: Compile and test the native feature utilities
        run: |
          set -euo pipefail
          ASTERI_XCODE_VERSION=$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')
          sudo xcode-select -s "/Applications/Xcode_${ASTERI_XCODE_VERSION}.app/Contents/Developer"
          swift --version
          swift test --package-path submodules/AsteriFeatures
          swift test --configuration release --package-path submodules/AsteriFeatures
          ASTERI_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p "$RUNNER_TEMP/asteri-text"
          xcrun --sdk iphoneos swiftc -sdk "$ASTERI_SDK_PATH" -target arm64-apple-ios15.0 \
            -parse-as-library -emit-module -module-name AsteriFeatures \
            submodules/AsteriFeatures/Sources/AsteriFeatures/*.swift \
            -emit-module-path "$RUNNER_TEMP/asteri-text/AsteriFeatures.swiftmodule"
