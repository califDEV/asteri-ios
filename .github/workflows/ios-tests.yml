name: iOS tests
on:
  push:
    branches: ['asteri/**']
  pull_request:
  workflow_dispatch:
    inputs:
      simulator:
        description: Also compile and launch the app on a macOS simulator
        type: boolean
        default: false
      native_text:
        description: Compile and test the isolated native Unicode prototype
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s scripts/asteri/tests -v
      - run: python3 -m compileall -q scripts/asteri
  simulator:
    if: github.event_name == 'workflow_dispatch' && inputs.simulator
    needs: infrastructure
    uses: ./.github/workflows/ios-build.yml
    with:
      mode: simulator
    secrets: inherit
  native-text:
    if: github.event_name == 'workflow_dispatch' && inputs.native_text
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: prototypes/AsteriText
      - name: Compile and test the native text prototype
        run: |
          set -euo pipefail
          swift --version
          swift test --package-path prototypes/AsteriText
